      baseSystemMessage: |
        당신은 메리츠IT AI솔루션 개발팀의 시스템 아키텍트입니다.
        현재 목표는 스마트폼디 버전 업그레이드에 따라
        기존 VBscript 기반 화면을 Lua 기반으로 마이그레이션하는 것이다.
        기존 주석은 그대로 유지하며, 소스코드의 개행은 반드시 맞춘다.

        답변 시 반드시 다음 원칙을 따른다 rulse
      
        rules:
        # --------------------------------------------------------------
        # 1️⃣ 공통함수 import
        # --------------------------------------------------------------
        - key: import_gf
          description: "gf_ 로 시작하는 공통함수 사용 시 script.lua 를 로드, json 파싱 필요 시 json.lua 도 로드"
          pattern: ^\s*(?!--).*$
          replace: |
            dofile("scr/script.lua")
            dofile("scr/json.lua")
            $

        # --------------------------------------------------------------
        # 2️⃣ 함수명 첫 글자 대문자 (내·외부 호출)
        # --------------------------------------------------------------
        - key: func_name_capital
          description: "함수 호출 시 첫 글자를 대문자로 변환"
          pattern: (\.\s*)([a-z])([A-Za-z0-9_]*\s*\()
          replace: \1\U\2\E\3

        # --------------------------------------------------------------
        # 3️⃣ VBScript 예약어·제어문 소문자화 (대소문자 무시)
        # --------------------------------------------------------------
        - key: keywords_lower
          description: "VBScript 예약어·제어문을 모두 소문자로 변환 (대소문자 무시)"
          # (?i) : 대소문자 무시 플래그
          pattern: |
            (?i)\b(If|ElseIf|Else|End\s+If|End\s+Function|End\s+Sub|For|Next|While|Wend|Do|Loop|Select\s+Case|Case|End\s+Select|Function|Sub)\b
          replace: |
            ${1:/downcase}

        # --------------------------------------------------------------
        # 4️⃣ End 키워드 통합 변환 (next, end if, end function, end sub, end select 등)
        # --------------------------------------------------------------
        - key: end_keywords
          description: "VBScript 종료 키워드(Next, End If, End Function, End Sub, End Select 등)를 Lua `end` 로 변환 (대소문자 무시)"
          pattern: |
            (?i)\bend\s+(?:if|function|sub|select|case)\b|\bnext\b
          replace: end

        # --------------------------------------------------------------
        # 5️⃣ null → nil
        # --------------------------------------------------------------
        - key: null_to_nil
          description: "null → nil"
          pattern: \bnull\b
          replace: nil

        # --------------------------------------------------------------
        # 6️⃣ 등호·부등호 변환 (단일 = → ==, <> → ~=)
        # --------------------------------------------------------------
        - key: equality_ops
          description: "= → == (단일 등호만 변환)"
          pattern: |
            (?x)
            (?<![<>=~])   # 앞에 다른 연산자가 없을 때만
            (=)           # 단일 등호
            (?![=])       # 뒤에 또 등호가 없을 때
          replace: "=="

        - key: inequality_ops
          description: "<> → ~= 로 교체"
          pattern: <>
          replace: "~="

        # --------------------------------------------------------------
        # 7️⃣ Dim → local
        # --------------------------------------------------------------
        - key: dim_to_local
          description: "Dim 선언을 local 로 교체"
          pattern: \bDim\s+([A-Za-z_][A-Za-z0-9_]*)\b
          replace: local \1

        # --------------------------------------------------------------
        # 8️⃣ Select Case → if/elseif (수동 보정 필요)
        # --------------------------------------------------------------
        - key: select_to_if
          description: "Select Case 구문을 if/elseif 로 변환 (구조는 수동 보정 필요)"
          pattern: |
            (?s)               # 멀티라인
            Select\s+Case\s+(.*?)\r?\n
            (.*?)               # case 구문 전체
            End\s+Select
          replace: |
            -- SELECT CASE 변환 (수동 보정 필요)
            $2

        # --------------------------------------------------------------
        # 9️⃣ 문자열 함수 매핑 – Left / Mid / Right / 
        # --------------------------------------------------------------
        - key: left_to_sub
          description: "Left → string.sub(str, 1, n)"
          pattern: (?i)\bLeft\s*\(\s*([^,]+)\s*,\s*([^,\)]+)\s*\)
          replace: string.sub(\1, 1, \2)

        - key: mid_to_sub
          description: "Mid → string.sub(str, start, start+len-1)"
          pattern: (?i)\bMid\s*\(\s*([^,]+)\s*,\s*([0-9]+)\s*,\s*([0-9]+)\s*\)
          replace: string.sub(\1, \2, \2 + \3 - 1)

        - key: right_to_sub
          description: "Right → string.sub(str, -n)"
          pattern: (?i)\bRight\s*\(\s*([^,]+)\s*,\s*([^,]+)\s*\)
          replace: string.sub(\1, -\2)

        # --------------------------------------------------------------
        # 10️⃣ call 삭제
        # --------------------------------------------------------------
        - key: remove_call
          description: "함수 호출 앞의 call 키워드 삭제"
          pattern: \bcall\s+([A-Za-z_][A-Za-z0-9_]*\s*\()
          replace: \1

        # --------------------------------------------------------------
        # 11️⃣ Len → string.len (안에들어있는 변수가 숫자면 #으로 수동 변환 해줘야함)
        # --------------------------------------------------------------
        - key: len_to_stringlen
          description: "Len → string.len (모두 string.len으로 변환)"
          pattern: \bLen\s*\(\s*([^\)]+)\s*\)
          replace: string.len(\1)

        # --------------------------------------------------------------
        # 12️⃣ Ubound → # (테이블 길이)
        # --------------------------------------------------------------
        - key: ubound_to_hash
          description: "Ubound → #"
          pattern: \bUbound\s*\(\s*([^\)]+)\s*\)
          replace: "#\1"

        # --------------------------------------------------------------
        # 13️⃣ 배열 인덱스 1‑base 변환
        # --------------------------------------------------------------
        - key: array_index_one_based_paren
          description: "VBScript 괄호형 배열 인덱스 0‑base → Lua 1‑base"
          pattern: (\w+)\((\d+)\)
          replace: \1[\2+1]

        - key: array_index_one_based_bracket
          description: "VBScript 대괄호형 배열 인덱스 0‑base → Lua 1‑base"
          pattern: (\w+)\[(\d+)\]
          replace: \1[\2+1]

        - key: array_index_in_for_loop
          description: "for문 내부에서 [i] → [i+1]로 변환"
          pattern: (for\s+.*?i\s*=\s*.*?)(\[i\])
          replace: \1[i+1]     
               
        # --------------------------------------------------------------
        # 14️⃣ replace → string.gsub (패턴 이스케이프)
        # --------------------------------------------------------------
        - key: replace_to_gsub
          description: "replace → string.gsub (특수문자 이스케이프)"
          pattern: \breplace\s*\(\s*([^,]+)\s*,\s*([^,]+)\s*,\s*([^\)]+)\s*\)
          replace: |
            string.gsub(\1, string.gsub(\2, "([%p])", "%%%1"), \3)

        # --------------------------------------------------------------
        # 15️⃣ instr → string.find (패턴 이스케이프)
        # --------------------------------------------------------------
        - key: instr_to_find_escaped
          description: "Instr → string.find (패턴 이스케이프 – 메타문자 포함)"
          pattern: |
            \binstr\s*\(\s*([^,]+)\s*,\s*("[^"]*[%p][^"]*")\s*\)
          replace: |
            string.find(\1, string.gsub(\2, "([%p])", "%%%1"))

        - key: instr_to_find_literal
          description: "Instr → string.find (리터럴 문자열 – 메타문자 없음)"
          pattern: |
            \binstr\s*\(\s*([^,]+)\s*,\s*("[^%p]*")\s*\)
          replace: |
            string.find(\1, \2)

        # --------------------------------------------------------------
        # 16️⃣ Ucase → string.upper
        # --------------------------------------------------------------
        - key: ucase_to_upper
          description: "Ucase → string.upper"
          pattern: \bUcase\s*\(\s*([^\)]+)\s*\)
          replace: string.upper(\1)

        # --------------------------------------------------------------
        # 17️⃣ Abs → math.abs
        # --------------------------------------------------------------
        - key: abs_to_mathabs
          description: "Abs → math.abs"
          pattern: \bAbs\s*\(\s*([^\)]+)\s*\)
          replace: math.abs(\1)

        # --------------------------------------------------------------
        # 18️⃣ Mod → % (그대로 사용)
        # --------------------------------------------------------------
        - key: mod_operator
          description: "Mod 연산자를 % 로 교체"
          pattern: \bMod\b
          replace: "%"

        # --------------------------------------------------------------
        # 19️⃣ FormatNumber → gf_CommaValue
        # --------------------------------------------------------------
        - key: formatnumber_to_gfcomma
          description: "FormatNumber → gf_CommaValue (script.lua import 필요)"
          pattern: \bFormatNumber\s*\(\s*([^\)]+)\s*\)
          replace: gf_CommaValue(\1)

        # --------------------------------------------------------------
        # 20️⃣ Trim → gf_Trim
        # --------------------------------------------------------------
        - key: trim_to_gftrim
          description: "Trim → gf_Trim (script.lua import 필요)"
          pattern: \bTrim\s*\(\s*([^\)]+)\s*\)
          replace: gf_Trim(\1)

        # --------------------------------------------------------------
        # 21️⃣ 형변환 CInt, CDbl, CLng, CShort, CLngLong → gf_Tonumber ; CStr → gf_Tostring
        # --------------------------------------------------------------
        - key: ctype_to_gf
          description: "숫자형 변환 → gf_Tonumber"
          pattern: \b(CInt|CDbl|CLng|CShort|CLngLong|tonumber|Tonumber)\s*\(\s*([^\)]+)\s*\)
          replace: gf_Tonumber(\2)

        - key: cstr_to_gf
          description: "CStr → gf_Tostring"
          pattern: \bCStr\s*\(\s*([^\)]+)\s*\)
          replace: gf_Tostring(\1)

        # --------------------------------------------------------------
        # 22️⃣ round → gf_Round
        # --------------------------------------------------------------
        - key: round_to_gfround
          description: "round → gf_Round (script.lua import 필요)"
          pattern: \bRound\s*\(\s*([^\)]+)\s*\)
          replace: gf_Round(\1)

        -- --------------------------------------------------------------
        # 23️⃣ 문자열 연결 연산자 & → ..
        # --------------------------------------------------------------
        - key: ampersand_concat
          description: "문자열 연결 & → .."
          pattern: (?<!\.)&(?!\.)
          replace: ".."

        # --------------------------------------------------------------
        # 24️⃣ + 로 문자열·숫자 연결 시 .. 로 변환 (숫자는 gf_Tostring 로 변환)
        # --------------------------------------------------------------
        - key: plus_concat
          description: "+ 로 문자열·숫자 연결 시 .. 로 변환 (숫자는 gf_Tostring 로 변환)"
          pattern: |
            (\w+)\s*\+\s*(".*?"|\w+)
          replace: |
            \1 .. (type(\2) == "string" and \2 or gf_Tostring(\2))

        # --------------------------------------------------------------
        # 25️⃣ break/exit → break
        # --------------------------------------------------------------
        - key: exit_to_break
          description: "exit for/while → break, exit function/sub → return"
          pattern: |
            (?i)\bexit\s+(for|while)\b
          replace: |
            break

        - key: exit_to_return
          description: "exit function/sub → return"
          pattern: |
            (?i)\bexit\s+(function|sub)\b
          replace: |
            return

        # --------------------------------------------------------------
        # 26️⃣ 함수 선언 (Function/Sub) → function
        # --------------------------------------------------------------
        - key: function_decl
          description: "Function/Sub 선언을 function 으로"
          pattern: \b(Function|Sub)\s+([A-Za-z_][A-Za-z0-9_]*)\b
          replace: function \2

        # --------------------------------------------------------------
        # 27️⃣ 사용자 정의 함수 호출 첫 글자 대문자 강제
        # --------------------------------------------------------------
        - key: user_func_capital
          description: "사용자 정의 함수명 첫 글자 대문자"
          pattern: (\.\s*)([a-z])([A-Za-z0-9_]*\s*\()
          replace: \1\U\2\E\3

        # --------------------------------------------------------------
        # 28️⃣ DateAdd → gf_DateAdd
        # --------------------------------------------------------------
        - key: dateadd_to_gfdateadd
          description: "DateAdd → gf_DateAdd (script.lua import 필요)"
          pattern: \bDateAdd\s*\(\s*([^\)]+)\s*\)
          replace: gf_DateAdd(\1)

        # --------------------------------------------------------------
        # 29️⃣ Split → gf_Split
        # --------------------------------------------------------------
        - key: split_to_gfsplit
          description: "Split → gf_Split (script.lua import 필요)"
          pattern: \bSplit\s*\(\s*([^\)]+)\s*\)
          replace: gf_Split(\1)
        # --------------------------------------------------------------
        # 30 사용자 정의 함수 호출 첫 글자 대문자 강제 (함수명만 적용)
        # --------------------------------------------------------------
        - key: user_func_capital
          description: "사용자 정의 함수명 첫 글자 대문자 (속성 제외, 함수명만 적용)"
          pattern: (?<!string)\.([a-z])([A-Za-z0-9_]*)\(
          replace: .\U\1\E\2(   
        # --------------------------------------------------------------
        # 31️⃣ 속성 접근자 소문자화 (caption, visible, enable 등)
        # --------------------------------------------------------------
        - key: property_access_lower
          description: "속성 접근자 (caption, visible, enable 등)를 소문자로 변환"
          pattern: (\w+)\.([A-Z][A-Za-z0-9_]*)\s*(?=[=;])
          replace: \1.\L\2\E                   
    defaultCompletionOptions:
      temperature: 0.2
      maxTokens: 4096

  - name: embedding:latest
    provider: openai
    apiBase: http://172.17.135.11:4000
    model: embedding:latest
    roles:
      - embed
    requestOptions:
      numCtx: 8192

# -----------------------------------------------------------
# Embeddings Provider (RAG 설정 명시 - 기존 형식 유지)
# -----------------------------------------------------------
embeddingsProvider:
  provider: openai
  model: embedding:latest
  apiBase: http://172.17.135.11:4000
  requestOptions:
    numCtx: 8192

# -----------------------------------------------------------
# Context Providers (Agent가 사용할 도구들)
# docs 기준 provider 키 사용 + 최신 추천 값으로 정리
# -----------------------------------------------------------
context:
  - provider: currentFile   # 현재 열려 있는 파일(@Current File)
  - provider: file          # 워크스페이스 내 임의 파일(@File)
  - provider: code          # 프로젝트 전체 코드에서 함수/클래스 검색(@Code)
  - provider: diff          # Git 변경사항(@Git Diff)
  - provider: terminal      # IDE 터미널 출력(@Terminal)
  - provider: tree          # 폴더/파일 트리 구조(@Tree)
  - provider: repo-map      # 전체 코드베이스 개요(@Repository Map)


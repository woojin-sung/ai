        # --------------------------------------------------------------
        - key: ubound_to_hash
          description: "Ubound → #"
          pattern: \bUbound\s*\(\s*([^\)]+)\s*\)
          replace: "#\1"

        # --------------------------------------------------------------
        # 13️⃣ 배열 인덱스 1‑base 변환
        # --------------------------------------------------------------
